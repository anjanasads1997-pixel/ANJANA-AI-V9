<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="ANJANA AI Sinhala and English Assistant">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>ANJANA AI V9.0</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#101827; color:#eef2ff; font-family:Arial,sans-serif; }
    main { width:min(100%,850px); margin:auto; padding:20px; }
    section { background:#1d293b; padding:22px; border-radius:16px; }
    h1 { margin-top:0; font-size:1.5rem; }
    label { display:block; margin:12px 0 6px; }
    input,textarea,select { width:100%; padding:12px; border:1px solid #526078; border-radius:8px; background:#f8fafc; color:#111827; font:inherit; }
    textarea { min-height:110px; resize:vertical; }
    button { padding:11px 15px; border:0; border-radius:8px; background:#75c46b; color:#102014; font-weight:bold; cursor:pointer; margin:8px 6px 4px 0; }
    button.secondary { background:#334155; color:#eef2ff; }
    button:disabled { opacity:.6; cursor:wait; }
    .muted { color:#cbd5e1; font-size:.9rem; }
    .panel { margin-top:18px; padding:16px; border:1px solid #46546b; border-radius:12px; }
    .hidden { display:none !important; }
    #messages { overflow-wrap:anywhere; }
    #messages p { padding:8px 10px; border-radius:8px; background:#26364d; }
    #authNotice,#chatNotice { min-height:1.4em; color:#fde68a; overflow-wrap:anywhere; }
    .topline { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="topline">
        <h1>ANJANA AI V9.0</h1>
        <span class="muted">Sinhala | English | Local AI</span>
      </div>

      <div id="authPanel" class="panel">
        <h2 id="authTitle">Login</h2>
        <p id="authHelp" class="muted">ඔබගේ ANJANA AI ගිණුමට ඇතුළු වන්න.</p>
        <form id="authForm">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username"
            minlength="3" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
            autocomplete="current-password" minlength="10" maxlength="128" required>
          <button id="authSubmit" type="submit">Login</button>
          <button id="toggleAuth" class="secondary" type="button">Create account</button>
        </form>
        <p id="authNotice" role="status" aria-live="polite"></p>
      </div>

      <div id="chatPanel" class="hidden">
        <div class="topline panel">
          <span id="welcomeUser"></span>
          <button id="logoutButton" class="secondary" type="button">Logout</button>
        </div>
        <div class="panel">
          <label for="language">Language</label>
          <select id="language">
            <option value="si">සිංහල</option>
            <option value="en">English</option>
          </select>
          <div id="messages" aria-live="polite">
            <p>ආයුබෝවන්! ANJANA AI වෙත සාදරයෙන් පිළිගනිමු.</p>
          </div>
          <form id="chatForm">
            <label for="prompt">ඔබගේ පණිවිඩය</label>
            <textarea id="prompt" placeholder="ඔබගේ ප්‍රශ්නය ලියන්න..." required></textarea>
            <button id="sendButton" type="submit">යවන්න / Send</button>
          </form>
          <p id="status" class="muted">සේවාදායකය පරීක්ෂා කරමින්...</p>
          <p id="chatNotice" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
